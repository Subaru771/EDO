
name: Build Edo TV APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # Download Edo source code
      - name: Checkout project
        uses: actions/checkout@v4

      # Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Install modern Android SDK tools
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # Install Android API 35
      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # Install Gradle
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Compile Edo Android TV APK
      - name: Build Edo debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      # Save the compiled APK
      - name: Upload Edo APK
        uses: actions/upload-artifact@v4
        with:
          name: Edo-v5.4.2-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
