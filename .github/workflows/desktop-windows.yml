name: Build and publish Edo Desktop v1.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/src/**'
      - 'desktop/build.sh'
      - 'desktop/Start-Edo-Windows.cmd'
      - 'desktop/Start-Edo-Windows.vbs'
      - 'desktop/README-WINDOWS-v1.0.md'
      - '.github/workflows/desktop-windows.yml'

permissions:
  contents: write

jobs:
  windows-desktop:
    name: Java 21 desktop release
    runs-on: windows-latest
    steps:
      - name: Check out Edo
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build modern Edo Desktop v1.0
        shell: bash
        run: bash desktop/build.sh

      - name: Verify Java 21 class version and package Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $jar = "desktop/dist/Edo-Desktop.jar"
          if (-not (Test-Path $jar)) { throw "Missing desktop JAR" }
          $info = & javap -verbose -classpath $jar com.dropwave.desktop.DesktopMain
          if (-not ($info | Select-String "major version: 65")) { throw "Expected Java 21 class version 65" }
          $dir = "desktop/build/package/Edo-Desktop-v1.0"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item $jar "$dir/Edo-Desktop.jar"
          Copy-Item "desktop/Start-Edo-Windows.cmd" "$dir/Start-Edo-Windows.cmd"
          Copy-Item "desktop/Start-Edo-Windows.vbs" "$dir/Start-Edo-Windows.vbs"
          Copy-Item "desktop/README-WINDOWS-v1.0.md" "$dir/README.md"
          Copy-Item "docs/PC-TO-PC.md" "$dir/PC-TO-PC.md"
          Copy-Item "docs/SHARING-GUIDE.md" "$dir/SHARING-GUIDE.md"
          Compress-Archive -Path $dir -DestinationPath "Edo-Desktop-v1.0-Windows.zip" -CompressionLevel Optimal -Force

      - name: Upload Windows ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Edo-Desktop-v1.0-Windows
          path: Edo-Desktop-v1.0-Windows.zip
          if-no-files-found: error

      - name: Publish desktop v1.0 ZIP to existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          gh release view v5.4.2 --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Android TV release v5.4.2 does not exist" }
          gh release upload v5.4.2 "Edo-Desktop-v1.0-Windows.zip" --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish Edo Desktop ZIP" }
          gh release delete-asset v5.4.2 "Edo-v5.4.2-Windows-PC.zip" --repo $env:GITHUB_REPOSITORY --yes
          if ($LASTEXITCODE -ne 0) { Write-Host "Old Windows ZIP not present; continuing." }

      - name: Bundle optional portable Windows Edo.exe preview
        shell: pwsh
        continue-on-error: true
        run: |
          jpackage --type app-image --name Edo --input desktop/dist --main-jar Edo-Desktop.jar --main-class com.dropwave.desktop.DesktopMain --app-version 1.0 --dest desktop/build/windows --icon desktop/resources/edo-icon.ico --vendor Edo
          if ($LASTEXITCODE -ne 0) { throw "Optional portable EXE build failed" }
          Compress-Archive -Path "desktop/build/windows/Edo" -DestinationPath "Edo-Desktop-v1.0-Portable-EXE.zip" -CompressionLevel Optimal

      - name: Upload portable EXE preview artifact
        if: ${{ hashFiles('Edo-Desktop-v1.0-Portable-EXE.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Edo-Desktop-v1.0-Portable-EXE-preview
          path: Edo-Desktop-v1.0-Portable-EXE.zip
          if-no-files-found: warn
