name: Edo • Checks & Downloads

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, design/edo-compact-v2]
  workflow_dispatch:

permissions:
  contents: read

# Only the latest push/PR check matters; never cancel a manually requested build.
concurrency:
  group: edo-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  checks:
    name: Desktop & transfer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile desktop
        run: bash desktop/build.sh
      - name: Test transfers, security & browser
        run: bash scripts/test-all.sh

  android:
    name: Android TV APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android TV
        run: gradle :app:assembleDebug --no-daemon
      # Upload only on demand, avoiding storage use on every push or PR.
      - name: Downloadable Android TV APK (manual build or Edo Compact preview)
        if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'design/edo-compact-v2' || github.ref == 'refs/heads/design/edo-compact-v2' }}
        uses: actions/upload-artifact@v4
        with:
          name: Edo-Compact-Android-TV-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Windows portable EXE (manual builds only)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile desktop
        shell: bash
        run: bash desktop/build.sh
      - name: Bundle Java and package Edo.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path desktop/installers -Force | Out-Null
          jpackage --type app-image --name Edo --app-version 1.0 --vendor Edo --description 'Edo local file transfer' --input desktop/dist --main-jar Edo-Desktop.jar --main-class com.dropwave.desktop.DesktopMain --icon desktop/resources/edo-icon.ico --dest desktop/installers
          if ($LASTEXITCODE -ne 0) { throw 'jpackage failed' }
          if (-not (Test-Path desktop/installers/Edo/Edo.exe)) { throw 'Edo.exe is missing' }
          Compress-Archive -Path desktop/installers/Edo -DestinationPath Edo-Windows-Portable.zip -CompressionLevel Optimal -Force
          $hash = (Get-FileHash Edo-Windows-Portable.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Edo-Windows-Portable.zip" | Set-Content SHA256SUMS.txt -Encoding ascii
      - name: Downloadable Windows portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Edo-Windows-Portable
          path: |
            Edo-Windows-Portable.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3

# Signed Android releases are deliberately separate and require signing credentials.
# Debug APKs cannot update over a signed Android TV installation.
