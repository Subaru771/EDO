name: Finalize verified Edo v1.0 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v1.0.yml'

permissions:
  contents: write

jobs:
  verify-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android build tools for signature checks
        run: sdkmanager --install "build-tools;35.0.0" "platforms;android-35"

      - name: Download exact public release packages and older signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p new legacy
          gh release download v1.0 --repo "$GITHUB_REPOSITORY" --pattern 'app-release.apk' --dir new
          gh release download v1.0 --repo "$GITHUB_REPOSITORY" --pattern 'Edo-Desktop-v1.0-Windows-Portable.zip' --dir new
          gh release download v1.0 --repo "$GITHUB_REPOSITORY" --pattern 'SHA256SUMS-WINDOWS.txt' --dir new
          gh release download v5.4.2 --repo "$GITHUB_REPOSITORY" --pattern 'app-release.apk' --dir legacy
          (cd new && sha256sum --check SHA256SUMS-WINDOWS.txt)
          unzip -t new/Edo-Desktop-v1.0-Windows-Portable.zip >/dev/null
          unzip -l new/Edo-Desktop-v1.0-Windows-Portable.zip | grep -qE 'Edo[\\/]Edo\.exe'
          echo "Windows package archive and existing checksum verified."

      - name: Verify Android package version, signature, and signing continuity
        run: |
          set -euo pipefail
          APK=new/app-release.apk
          OLD=legacy/app-release.apk
          APK_SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$APK_SIGNER" verify --verbose "$APK"
          "$APK_SIGNER" verify --verbose "$OLD"
          PKG=$("$AAPT" dump badging "$APK" | head -n 1)
          echo "$PKG"
          [[ "$PKG" == *"name='com.dropwave.tv'"* ]]
          [[ "$PKG" == *"versionCode='57'"* ]]
          [[ "$PKG" == *"versionName='1.0'"* ]]
          NEW_CERT=$("$APK_SIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          OLD_CERT=$("$APK_SIGNER" verify --print-certs "$OLD" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test -n "$NEW_CERT"
          test -n "$OLD_CERT"
          if [ "$NEW_CERT" != "$OLD_CERT" ]; then
            echo "::error::New APK signer does NOT match v5.4.2; aborting stable release."
            exit 1
          fi
          echo "Android v1.0 package name, version code 57 and signing continuity verified."

      - name: Rename APK for v1.0 and publish combined checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.tag_name == "v1.0")] | first | .id // empty')
          test -n "$RELEASE_ID"
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '[.[] | select(.name == "app-release.apk")] | first | .id // empty')
          test -n "$ID"
          if gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
              --jq '[.[] | select(.name == "SHA256SUMS.txt")] | length' | grep -qx '0'; then
            :
          else
            echo "::error::Combined checksum already exists; refusing to overwrite."
            exit 1
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$ID" \
            -f name=Edo-v1.0-Android-TV.apk >/dev/null
          cp new/app-release.apk new/Edo-v1.0-Android-TV.apk
          (cd new && sha256sum Edo-v1.0-Android-TV.apk Edo-Desktop-v1.0-Windows-Portable.zip > SHA256SUMS.txt)
          gh release upload v1.0 new/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"
          gh release edit v1.0 --repo "$GITHUB_REPOSITORY" \
            --title "Edo v1.0" --notes-file docs/RELEASE-NOTES.md --prerelease=false --latest
          echo "Stable release and combined checksums ready."
