name: Stage tested Edo v1.0 Windows download

# One-time automatic staging when introduced; reusable manually if needed.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage-v1.0-windows.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  stage-tested-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Check v1.0 is an unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.tag_name == "v1.0" and .draft == true)] | first | .id // empty')
          if [ -z "$id" ]; then
            echo "::error::No unpublished Edo v1.0 draft found. Refusing to touch public releases."
            exit 1
          fi
          echo "RELEASE_ID=$id" >> "$GITHUB_ENV"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" \
            --jq '[.[] | select(.name == "Edo-Desktop-v1.0-Windows-Portable.zip")] | length')
          if [ "$existing" != "0" ]; then
            echo "::error::The Windows asset is already attached. Refusing to overwrite it."
            exit 1
          fi
      - name: Retrieve hardware-tested successful Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p stage
          gh run download 41421689920 --repo "$GITHUB_REPOSITORY" \
            --name Edo-Desktop-v1.0-Portable --dir stage
          test -s stage/Edo-Desktop-v1.0-Windows-Portable.zip
          test -s stage/SHA256SUMS.txt
          (cd stage && sha256sum --check SHA256SUMS.txt)
          cp stage/SHA256SUMS.txt stage/SHA256SUMS-WINDOWS.txt
      - name: Upload Windows binary and checksum to draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for filename in Edo-Desktop-v1.0-Windows-Portable.zip SHA256SUMS-WINDOWS.txt; do
            content_type=application/octet-stream
            if [[ "$filename" == *.zip ]]; then content_type=application/zip; fi
            curl --fail-with-body --silent --show-error --retry 2 \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: $content_type" \
              --data-binary "@stage/$filename" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$filename" \
              > /dev/null
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[] | [.name, .size] | @tsv'
