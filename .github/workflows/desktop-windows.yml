name: Build and publish Edo Desktop v1.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'scripts/test-all.sh'
      - 'scripts/verify-brand-assets.py'
      - 'app/src/main/java/com/dropwave/tv/**'
      - 'app/src/main/assets/index.html'
      - '.github/workflows/desktop-windows.yml'

permissions:
  contents: write

jobs:
  tests:
    name: Desktop and transfer regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run Edo transfer and file-browser tests
        run: bash scripts/test-all.sh

  desktop-windows:
    name: Windows ZIP and existing release update
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Edo Desktop v1.0
        shell: bash
        run: bash desktop/build.sh
      - name: Verify desktop version
        shell: pwsh
        run: |
          & jar xf desktop/dist/Edo-Desktop.jar META-INF/MANIFEST.MF
          $text = Get-Content META-INF/MANIFEST.MF -Raw
          if ($text -notmatch 'Implementation-Version: 1.0') { throw 'Desktop JAR is not v1.0' }
      - name: Package Windows download
        shell: pwsh
        run: |
          $folder = 'desktop/build/package/Edo-Desktop-v1.0'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item desktop/dist/Edo-Desktop.jar $folder
          Copy-Item desktop/Start-Edo-Windows.cmd $folder
          Copy-Item desktop/Start-Edo-Windows.vbs $folder
          Copy-Item docs/PC-TO-PC.md "$folder/PC-TO-PC.md"
          Copy-Item docs/SHARING-GUIDE.md "$folder/SHARING-GUIDE.md"
          Copy-Item desktop/README-FIRST.txt "$folder/README-FIRST.txt"
          Compress-Archive -Path $folder -DestinationPath Edo-Desktop-v1.0-Windows.zip -CompressionLevel Optimal -Force
          if (-not (Test-Path Edo-Desktop-v1.0-Windows.zip)) { throw 'No ZIP was created' }
      - name: Upload Windows ZIP workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Edo-Desktop-v1.0-Windows
          path: Edo-Desktop-v1.0-Windows.zip
          if-no-files-found: error
      - name: Replace Windows ZIP in existing v5.4.2 GitHub release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v5.4.2 --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'Existing v5.4.2 release is missing' }
          gh release upload v5.4.2 Edo-Desktop-v1.0-Windows.zip --clobber --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
