name: Edo Desktop v1.0 - Windows bundled-runtime build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'app/src/main/java/com/dropwave/tv/**'
      - 'scripts/test-all.sh'
      - '.github/workflows/desktop-windows.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run transfer and desktop tests
        run: bash scripts/test-all.sh

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Edo Desktop v1.0
        shell: bash
        run: bash desktop/build.sh
      - name: Build portable Edo.exe with bundled Java
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path desktop/installers -Force | Out-Null
          jpackage --type app-image --name Edo --app-version 1.0 --vendor 'Edo' --description 'Edo local file transfer' --input desktop/dist --main-jar Edo-Desktop.jar --main-class com.dropwave.desktop.DesktopMain --icon desktop/resources/edo-icon.ico --dest desktop/installers
          if ($LASTEXITCODE -ne 0) { throw 'jpackage failed' }
          if (-not (Test-Path desktop/installers/Edo/Edo.exe)) { throw 'Edo.exe missing' }
          Compress-Archive -Path desktop/installers/Edo -DestinationPath Edo-Desktop-v1.0-Windows-Portable.zip -CompressionLevel Optimal -Force
          $hash = (Get-FileHash Edo-Desktop-v1.0-Windows-Portable.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Edo-Desktop-v1.0-Windows-Portable.zip" | Set-Content SHA256SUMS.txt -Encoding ascii
      - name: Upload portable Edo.exe and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Edo-Desktop-v1.0-Portable
          path: |
            Edo-Desktop-v1.0-Windows-Portable.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Optional Windows EXE installer
        shell: pwsh
        continue-on-error: true
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) { Write-Host 'WiX unavailable; portable build is ready.'; exit 0 }
          jpackage --type exe --name Edo --app-version 1.0 --vendor Edo --description 'Edo local file transfer' --input desktop/dist --main-jar Edo-Desktop.jar --main-class com.dropwave.desktop.DesktopMain --icon desktop/resources/edo-icon.ico --dest desktop/installers --win-menu --win-shortcut
          if ($LASTEXITCODE -ne 0) { throw 'Optional installer failed' }
          $exe = Get-ChildItem desktop/installers -Filter '*.exe' | Select-Object -First 1
          if ($exe) { Copy-Item $exe.FullName Edo-Desktop-v1.0-Setup.exe }
      - name: Upload optional installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Edo-Desktop-v1.0-Setup-Optional
          path: Edo-Desktop-v1.0-Setup.exe
          if-no-files-found: ignore

# IMPORTANT: CI builds preview artifacts only.
# Never overwrite or publish GitHub Release assets automatically.
